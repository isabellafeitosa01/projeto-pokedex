<svg
  width="40" height="40"
  viewBox="0 0 40 40"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="ballClip">
      <circle cx="20" cy="20" r="20" />
    </clipPath>
  </defs>

  <!-- metade de cima (cor de destaque) e metade de baixo (escura) -->
  <g clip-path="url(#ballClip)">
    <rect x="0" y="0" width="40" height="20" fill="#E8586A" />
    <rect x="0" y="20" width="40" height="20" fill="#252534" />
  </g>

  <!-- linha central -->
  <rect x="0" y="18.5" width="40" height="3" fill="#FDF1E6" />

  <!-- botão central -->
  <circle cx="20" cy="20" r="6" fill="#252534" />
  <circle cx="20" cy="20" r="6" fill="none" stroke="#FDF1E6" stroke-width="3" />
</svg>
